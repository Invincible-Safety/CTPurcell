<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
  <link rel="apple-touch-icon" href="icon_180.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icon_180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon_192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icon_512.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Invincible Safety">

  <link rel="manifest" href="manifest.json">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Management — Invincible</title>
<style>
  :root {
    --navy:#0d1b2a;--navy2:#1a2e45;--navy3:#243c57;
    --gold:#c9922a;--gold2:#e8a830;
    --red:#c0392b;--green:#1e8449;--green-light:#27ae60;
    --text:#1a2e45;--text-light:#5d7a8a;
    --border:#d5dee6;--light:#f4f6f9;--shadow:0 2px 12px rgba(13,27,42,0.10);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--light);color:var(--text);min-height:100vh;}

  .topbar{background:var(--navy);color:white;padding:0 24px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,0.3);}
  .topbar-left{display:flex;align-items:center;gap:16px;}
  .back-btn{background:var(--navy3);color:white;border:none;padding:7px 14px;border-radius:6px;cursor:pointer;font-size:13px;text-decoration:none;display:flex;align-items:center;gap:6px;}
  .back-btn:hover{background:var(--gold);}
  .topbar h1{font-size:17px;font-weight:700;color:var(--gold2);}

  .content{max-width:1000px;margin:24px auto;padding:0 20px;}

  .stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin-bottom:24px;}
  .stat-card{background:white;border-radius:10px;padding:16px;box-shadow:var(--shadow);border-left:4px solid var(--navy3);}
  .stat-card.gold{border-left-color:var(--gold);}
  .stat-card.green{border-left-color:var(--green-light);}
  .stat-card.red{border-left-color:var(--red);}
  .stat-num{font-size:26px;font-weight:800;color:var(--navy);}
  .stat-label{font-size:11px;color:var(--text-light);text-transform:uppercase;letter-spacing:0.5px;margin-top:2px;}

  .card{background:white;border-radius:10px;box-shadow:var(--shadow);margin-bottom:20px;overflow:hidden;}
  .card-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
  .card-header h2{font-size:15px;font-weight:700;color:var(--navy);}

  .btn{padding:8px 16px;border-radius:7px;border:none;cursor:pointer;font-size:13px;font-weight:600;transition:all 0.15s;display:inline-flex;align-items:center;gap:6px;}
  .btn-gold{background:var(--gold);color:white;}
  .btn-gold:hover{background:var(--gold2);}
  .btn-outline{background:white;color:var(--navy);border:1px solid var(--border);}
  .btn-outline:hover{background:var(--light);}
  .btn-red{background:var(--red);color:white;}
  .btn-green{background:var(--green-light);color:white;}
  .btn-sm{padding:5px 10px;font-size:12px;}

  table{width:100%;border-collapse:collapse;}
  th{padding:10px 16px;text-align:left;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-light);background:#f8fafc;border-bottom:1px solid var(--border);}
  td{padding:12px 16px;font-size:13px;border-bottom:1px solid #eef1f5;vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  tr:hover td{background:#f8fafc;}

  .badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap;}
  .badge-gold{background:#fef3e2;color:#b7600a;border:1px solid #fcd9a0;}
  .badge-navy{background:#e8f0f8;color:var(--navy2);border:1px solid #b8d0e8;}
  .badge-green{background:#eafaf1;color:var(--green);border:1px solid #a9dfbf;}
  .badge-red{background:#fdedec;color:var(--red);border:1px solid #f5b7b1;}
  .badge-gray{background:#f2f3f4;color:#7f8c8d;border:1px solid #d5d8dc;}
  .badge-purple{background:#f5eef8;color:#7d3c98;border:1px solid #d7bde2;}

  .role-select{padding:5px 8px;border:1px solid var(--border);border-radius:6px;font-size:12px;color:var(--text);background:white;cursor:pointer;}
  .role-select:focus{outline:none;border-color:var(--gold);}

  .toggle{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-light);}
  .toggle input[type=checkbox]{width:16px;height:16px;cursor:pointer;accent-color:var(--gold);}

  .search-bar{padding:8px 12px;border:1px solid var(--border);border-radius:7px;font-size:13px;width:220px;}
  .search-bar:focus{outline:none;border-color:var(--gold);}

  .filter-tabs{display:flex;gap:0;background:white;border-radius:7px;border:1px solid var(--border);overflow:hidden;}
  .filter-tab{padding:7px 14px;font-size:12px;font-weight:600;cursor:pointer;border:none;background:transparent;color:var(--text-light);border-right:1px solid var(--border);}
  .filter-tab:last-child{border-right:none;}
  .filter-tab.active{background:var(--navy);color:white;}

  .qr-section{text-align:center;padding:24px;}
  #qrCanvas{border:4px solid var(--navy);border-radius:8px;margin:12px auto;display:block;}
  .qr-url{font-size:12px;color:var(--text-light);word-break:break-all;margin-top:8px;}

  .toast{position:fixed;bottom:24px;right:24px;background:var(--navy);color:white;padding:12px 18px;border-radius:8px;font-size:13px;font-weight:600;z-index:9999;transform:translateY(100px);transition:transform 0.3s;box-shadow:0 4px 20px rgba(0,0,0,0.3);}
  .toast.show{transform:translateY(0);}
  .toast.success{background:var(--green);}
</style>
</head>

<script>
function signOut() {

<script>
const SUPABASE_URL = 'https://ekeurkmlapouxdtvjrpv.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVrZXVya21sYXBvdXhkdHZqcnB2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgzNzcwOTgsImV4cCI6MjA5Mzk1MzA5OH0.2eR4kCJSrHDuwLjpLbU3Ewn3UcfMAEumvjPWNf1I1BU';
const INACTIVITY_MS = 2 * 60 * 60 * 1000;
const PERMANENT_ROLES = ['exec_admin'];

const ROLE_OPTIONS = [
  {value:'exec_admin', label:'Executive Administration'},
  {value:'exec_mgr',   label:'Executive Management'},
  {value:'safety_mgr', label:'Safety Manager'},
  {value:'superintendent', label:'Superintendent'},
  {value:'foreman',    label:'Foreman'},
  {value:'crew',       label:'Crew Member'},
];

const ROLE_BADGES = {
  exec_admin:    'badge-purple',
  exec_mgr:      'badge-navy',
  safety_mgr:    'badge-gold',
  superintendent:'badge-gold',
  foreman:       'badge-green',
  crew:          'badge-gray',
};

let allUsers = [];
let currentFilter = 'all';

// Auth check
function checkAuth() {
  const s = localStorage.getItem('inv_session');
  if (!s) { window.location.href = 'login.html'; return null; }
  try {
    const session = JSON.parse(s);
    if (!PERMANENT_ROLES.includes(session.role)) {
      const lastActive = parseInt(localStorage.getItem('inv_last_active') || '0');
      if (Date.now() - lastActive > INACTIVITY_MS) { logout(); return null; }
    }
    if (session.role !== 'exec_admin' && session.role !== 'safety_mgr') {
      window.location.href = 'index.html';
      return null;
    }
    document.getElementById('sessionName').textContent = session.name;
    localStorage.setItem('inv_last_active', Date.now().toString());
    return session;
  } catch { logout(); return null; }
}

function logout() {
  localStorage.removeItem('inv_session');
  localStorage.removeItem('inv_last_active');
  window.location.href = 'login.html';
}

async function loadUsers() {
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/app_users?select=*&order=full_name.asc`, {
      headers: {'apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`}
    });
    allUsers = await res.json();
    renderStats();
    renderTable();
  } catch(e) {
    document.getElementById('userTableBody').innerHTML = '<tr><td colspan="7" style="text-align:center;color:var(--red)">Error loading users</td></tr>';
  }
}

function renderStats() {
  document.getElementById('statTotal').textContent = allUsers.length;
  document.getElementById('statPending').textContent = allUsers.filter(u=>u.status==='pending').length;
  document.getElementById('statActive').textContent = allUsers.filter(u=>u.status==='active').length;
  document.getElementById('statInactive').textContent = allUsers.filter(u=>u.status==='inactive').length;
}

function setFilter(f, el) {
  currentFilter = f;
  document.querySelectorAll('.filter-tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  renderTable(document.getElementById('userSearch').value);
}

function filterUsers(q) { renderTable(q); }

function renderTable(q='') {
  let users = allUsers;
  if (currentFilter !== 'all') users = users.filter(u => u.status === currentFilter);
  if (q) users = users.filter(u => u.full_name.toLowerCase().includes(q.toLowerCase()) || u.email.toLowerCase().includes(q.toLowerCase()));

  const tbody = document.getElementById('userTableBody');
  if (users.length === 0) {
    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:var(--text-light);padding:24px;">No users found</td></tr>';
    return;
  }

  tbody.innerHTML = users.map(u => {
    const roleOpts = ROLE_OPTIONS.map(r => `<option value="${r.value}" ${u.role===r.value?'selected':''}>${r.label}</option>`).join('');
    const statusBadge = u.status === 'active' ? '<span class="badge badge-green">✅ Active</span>'
      : u.status === 'pending' ? '<span class="badge badge-gold">⏳ Pending</span>'
      : '<span class="badge badge-red">❌ Inactive</span>';
    const lastLogin = u.last_login ? new Date(u.last_login).toLocaleDateString() : 'Never';
    const roleBadgeClass = ROLE_BADGES[u.role] || 'badge-gray';

    return `<tr>
      <td><strong>${u.full_name}</strong></td>
      <td style="color:var(--text-light)">${u.email}</td>
      <td>
        <select class="role-select" onchange="updateRole('${u.id}', this.value)">
          ${roleOpts}
        </select>
      </td>
      <td>${statusBadge}</td>
      <td>
        <div class="toggle">
          <input type="checkbox" ${u.time_reports_unlocked?'checked':''} onchange="toggleTimeReports('${u.id}', this.checked)">
          <span>${u.time_reports_unlocked ? 'Unlocked' : 'Locked'}</span>
        </div>
      </td>
      <td style="color:var(--text-light);font-size:12px;">${lastLogin}</td>
      <td>
        <div style="display:flex;gap:6px;flex-wrap:wrap;">
          ${u.status === 'pending' ? `<button class="btn btn-green btn-sm" onclick="approveUser('${u.id}')">✓ Approve</button>` : ''}
          ${u.status === 'active' ? `<button class="btn btn-outline btn-sm" onclick="deactivateUser('${u.id}')">Deactivate</button>` : ''}
          ${u.status === 'inactive' ? `<button class="btn btn-outline btn-sm" onclick="approveUser('${u.id}')">Reactivate</button>` : ''}
        </div>
      </td>
    </tr>`;
  }).join('');
}

async function updateRole(userId, newRole) {
  try {
    await fetch(`${SUPABASE_URL}/rest/v1/app_users?id=eq.${userId}`, {
      method: 'PATCH',
      headers: {'apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`,'Content-Type':'application/json'},
      body: JSON.stringify({role: newRole})
    });
    const u = allUsers.find(u=>u.id===userId);
    if (u) u.role = newRole;
    showToast('Role updated!', 'success');
  } catch { showToast('Error updating role', ''); }
}

async function toggleTimeReports(userId, unlocked) {
  try {
    await fetch(`${SUPABASE_URL}/rest/v1/app_users?id=eq.${userId}`, {
      method: 'PATCH',
      headers: {'apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`,'Content-Type':'application/json'},
      body: JSON.stringify({time_reports_unlocked: unlocked})
    });
    const u = allUsers.find(u=>u.id===userId);
    if (u) u.time_reports_unlocked = unlocked;
    showToast(unlocked ? 'Time & Reports unlocked!' : 'Time & Reports locked', 'success');
    renderTable(document.getElementById('userSearch').value);
  } catch { showToast('Error updating access', ''); }
}

async function approveUser(userId) {
  try {
    await fetch(`${SUPABASE_URL}/rest/v1/app_users?id=eq.${userId}`, {
      method: 'PATCH',
      headers: {'apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`,'Content-Type':'application/json'},
      body: JSON.stringify({status: 'active'})
    });
    const u = allUsers.find(u=>u.id===userId);
    if (u) u.status = 'active';
    renderStats();
    renderTable(document.getElementById('userSearch').value);
    showToast('User approved and activated!', 'success');
  } catch { showToast('Error approving user', ''); }
}

async function deactivateUser(userId) {
  if (!confirm('Deactivate this user? They will not be able to log in.')) return;
  try {
    await fetch(`${SUPABASE_URL}/rest/v1/app_users?id=eq.${userId}`, {
      method: 'PATCH',
      headers: {'apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`,'Content-Type':'application/json'},
      body: JSON.stringify({status: 'inactive'})
    });
    const u = allUsers.find(u=>u.id===userId);
    if (u) u.status = 'inactive';
    renderStats();
    renderTable(document.getElementById('userSearch').value);
    showToast('User deactivated', '');
  } catch { showToast('Error deactivating user', ''); }
}

// QR CODE
function generateQR() {
  const url = 'https://ctpurcell.pages.dev/register.html';
  document.getElementById('qrUrl').textContent = url;

  const canvas = document.getElementById('qrCanvas');
  const ctx = canvas.getContext('2d');

  // Simple QR-like placeholder using qrcodejs lib if available
  try {
    // Use qrcodejs via CDN
    const div = document.createElement('div');
    new QRCode(div, {
      text: url, width: 200, height: 200,
      colorDark: '#0d1b2a', colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.H
    });
    setTimeout(() => {
      const img = div.querySelector('img') || div.querySelector('canvas');
      if (img) {
        const tempCanvas = div.querySelector('canvas');
        if (tempCanvas) {
          ctx.drawImage(tempCanvas, 0, 0, 200, 200);
        }
      }
    }, 300);
  } catch(e) {
    // Fallback — draw basic placeholder
    ctx.fillStyle = '#0d1b2a';
    ctx.fillRect(0, 0, 200, 200);
    ctx.fillStyle = 'white';
    ctx.font = 'bold 13px Segoe UI';
    ctx.textAlign = 'center';
    ctx.fillText('QR Code', 100, 90);
    ctx.font = '10px Segoe UI';
    ctx.fillText('genuine-gecko-7ef3f8', 100, 115);
    ctx.fillText('.netlify.app/register.html', 100, 130);
  }
}

function downloadQR() {
  const canvas = document.getElementById('qrCanvas');
  const a = document.createElement('a');
  a.download = 'Invincible_Safety_Registration_QR.png';
  a.href = canvas.toDataURL();
  a.click();
}

function copyRegLink() {
  navigator.clipboard.writeText('https://ctpurcell.pages.dev/register.html');
  showToast('Registration link copied!', 'success');
}

function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast ${type} show`;
  setTimeout(() => t.classList.remove('show'), 3000);
}

// Init
checkAuth();
loadUsers();
generateQR();
</script>
